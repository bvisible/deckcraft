[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/deckcraft", "apps/deckcraft-cli"]

[workspace.package]
version = "0.18.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/deckcraft"

[workspace.dependencies]
# internal
deckcraft-geom = { path = "crates/geom" }
deckcraft-color = { path = "crates/color" }
deckcraft-metafile = { path = "crates/metafile" }
deckcraft-model = { path = "crates/model" }
deckcraft-fonts = { path = "crates/fonts" }
deckcraft-text = { path = "crates/text" }
deckcraft-render = { path = "crates/render" }
deckcraft-pdf = { path = "crates/pdf" }
deckcraft-pptx = { path = "crates/pptx" }
deckcraft-format = { path = "crates/format" }
deckcraft-anim = { path = "crates/anim" }
deckcraft-engine = { path = "crates/engine" }
deckcraft-mcp = { path = "crates/mcp" }
deckcraft-ui-egui = { path = "crates/ui-egui" }
deckcraft-media = { path = "crates/media" }
# video codecs (ported from FilmCraft, same owner and licence)
deckcraft-bitstream = { path = "crates/bitstream" }
deckcraft-h264 = { path = "crates/h264" }
deckcraft-hevc = { path = "crates/hevc" }
deckcraft-vp9 = { path = "crates/vp9" }
deckcraft-av1 = { path = "crates/av1" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
# Base features are wasm-safe (`std` only). The non-wasm `clock` feature is requested
# per-crate for targets that read the local clock (see crates/text).
chrono = { version = "0.4", default-features = false, features = ["std"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
# craft-media and craft-audio share types and stay on one rev.
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "75895c0321d8cb6e175a42466cba050352b117c5", version = "=0.1.0", default-features = false }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "75895c0321d8cb6e175a42466cba050352b117c5", version = "=0.1.0", default-features = false, features = ["opus-decode"] }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", version = "=0.1.0", default-features = false, features = ["write", "write-simple-text"] }
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", features = ["egui"] }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", version = "=0.1.0" }
i_overlay = "9"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
web-time = "1.1"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

# //// Neoffice — the Nora assistant pane (crates/ui-egui/src/nora_pane.rs), the one NeoWrite (WordCraft) has, so the
# same Nora works in every editor. Neoffice's craft-libs fork carries Nora's client core and its egui panel, at the
# revision below (not always WordCraft's). Both depend on egui only (the same 0.37 as here from the v0.14.1 merge). To follow a newer craft-libs,
# move this revision; nothing else changes.
# //// Neoffice — revision da21317 (craft-libs version-15, 23.10.2026): the Stop, Undo offered only for what Nora
# changed, replies that stay in view, connection errors in the app's language (`NoraPanel::with_error_words`), the
# file id a hosting page names (`DocumentInfo::file_id`), where a link Nora wrote may lead (`links::web_or_mail`), and
# the cards and links of the conversation (`Output::Open`; print and the PDF are not this pane's yet).
# //// Neoffice — da21317: a reply's links to the instance on a row of their own under its words.
# //// Neoffice — 4945194 (23.10.2026): a card that asks for a choice (the mailbox to write an e-mail draft from), answered through
# the pane's own door, and the document's file handed for an e-mail draft (`doc_export_file`).
# //// Neoffice — d04a313 (23.10.2026): Nora's little Markdown drawn in her bubbles, not printed (bold, italic, code, lists).
# //// Neoffice — 72445c1 (23.10.2026): with no bold face of the app (`bold_family: None`), her bold words drawn twice a pixel apart.
# //// Neoffice — 5ffc07c (24.10.2026): craft-libs version-15 with upstream's main merged (7895f5e, which has the c3487320
# that craft-pdf and krilla are pinned to here), and an appointment card made from an e-mail answered yes or no in the pane.
# //// Neoffice — 4f48d82 (24.10.2026): a turn is not given up on the clock alone (a tab in the background gets no frame
# for minutes), and a late answer shows as it comes (bcc831f); the panel builds on egui 0.36 or 0.37 (0.37 here since the v0.14.1 merge).
# //// Neoffice — 1f01bcc (24.10.2026): a turn lost to a tab in the background offers to resume it (Resume), and
# never plays an action of a turn given up on, reads links in linear time; the pane ticks before it hands the answers over.
# //// Neoffice — 620d408 (24.10.2026): an action addressed to another conversation or document (a second editor open) is
# refused, a reply that says done after its write was refused is corrected (`correction_words`), a card after the final
# reply shows, a freeze is judged without the server's hours.
# //// Neoffice — 4d7eea6 (27.10.2026): Nora's button at the top of the editor (launcher, aa432bc, d9fc6e0), and the
# pane's words readable on a dark pane (its text, weak words and buttons not usable yet above 4.5:1).
# //// Neoffice — 7bc770d (05.11.2026): the pane in the Neoffice design system (paper, ink, Karla and Forum, Lucide, Nora's
# sphere), what Nora is doing in words, a microphone to dictate (`nora_dictation`), reads of her actions that follow what
# happens in the turn, and a clock that runs while the window is hidden (`drive`, pumped from `logic`). egui 0.37 only.
# //// Neoffice — 3247387 (05.11.2026): a microphone whose audio context a browser starts on a gesture still hears, and the sphere is drawn 12 times a second.
craft-nora = { git = "https://github.com/bvisible/craft-libs", rev = "324738706bc87d5cb8d87ab19414fd19c15eef34" }
craft-nora-ui = { git = "https://github.com/bvisible/craft-libs", rev = "324738706bc87d5cb8d87ab19414fd19c15eef34" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", version = "=0.8.2" }
