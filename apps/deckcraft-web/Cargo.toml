[package]
name = "deckcraft-web"
description = "DeckCraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "deckcraft-web"
path = "src/main.rs"

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# //// Neoffice — MessageEvent and UrlSearchParams are for the host bridge (src/host.rs); Headers, Request, RequestInit,
# RequestCredentials and Response are for the Nora pane's `fetch` (src/web/nora.rs).
# //// Neoffice — HtmlIFrameElement is for the print dialog Nora opens on the presentation's PDF
# (src/web.rs, `print_pdf`).
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "MessageEvent", "UrlSearchParams", "Headers", "Request", "RequestInit", "RequestCredentials", "Response"] }
